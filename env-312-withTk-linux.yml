# run: conda env create -f env-312-withTk-linux.yml
name: hgtd

channels:
  - conda-forge
  - nodefaults

dependencies:
  - python=3.12.*
  # Linux needs a conda-built Tk (system Tk is usually broken/missing)
  - tk[build=xft_*]
  - numpy>=2.3
  - requests>=2.31

  - pip
  - pip:
    - hgtd-tools[dev,gui]==3.0.0rc1
