# run: conda env create -f env-312.yml
name: hgtd

channels:
  - conda-forge
  - nodefaults

dependencies:
  - python=3.12.*
  # Linux needs a conda-built Tk (system Tk is usually broken/missing)
  - sel(linux): tk[build=xft_*]
  - numpy>=1.26
  - requests

  - pip
  - pip:
    - hgtd-tools[dev,gui]==2.0.0
    - mplhep
