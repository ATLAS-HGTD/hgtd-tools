workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "push"

stages:
  - build
  - deploy_docs
  - test
  - deploy_zenodo

pre-commit:
  stage: build
  image: registry.cern.ch/docker.io/library/python:3.12
  variables:
    # full history: the rebase fallback below needs a real branch, not a shallow one
    GIT_DEPTH: "0"
  script:
    - pip install pre-commit
    - |
      set -u
      BRANCH="${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME:-}"

      echo "== pass 1: check the merge result =="
      pre-commit run --all-files --show-diff-on-failure && exit 0
      echo "pre-commit reported issues."

      # --- auto-fix is only allowed for MR pipelines of this very project ---
      if [ "$CI_PIPELINE_SOURCE" != "merge_request_event" ]; then
        echo "Not a merge request pipeline -> no auto-fix commit."
        exit 1
      fi
      if [ "$CI_MERGE_REQUEST_SOURCE_PROJECT_PATH" != "$CI_PROJECT_PATH" ]; then
        echo "MR comes from a fork ($CI_MERGE_REQUEST_SOURCE_PROJECT_PATH) -> no auto-fix commit."
        exit 1
      fi
      if [ "$CI_PROJECT_NAMESPACE" != "anstein" ]; then
        echo "Not the upstream namespace -> no auto-fix commit."
        exit 1
      fi

      echo "== pass 2: apply fixes on the MR source branch =="
      git remote set-url origin \
        "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      git config user.name  "gitlab-ci-token"
      git config user.email "${GITLAB_USER_EMAIL:-gitlab-ci-token@${CI_SERVER_HOST}}"

      # MR pipelines check out a detached merge ref -> switch to the real branch tip
      git reset --hard
      git fetch --no-tags origin "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"
      git checkout -B "${BRANCH}" "origin/${BRANCH}"

      pre-commit run --all-files --show-diff-on-failure || true

      if git diff --quiet; then
        echo "Nothing was auto-fixable - failing as before."
        exit 1
      fi

      git add -A
      git commit -m "chore(pre-commit): apply automatic fixes" -m "[skip ci]"

      if ! git push origin "HEAD:refs/heads/${BRANCH}"; then
        echo "Push rejected, retrying once on top of the current branch tip."
        git fetch --no-tags origin "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"
        git rebase "origin/${BRANCH}"
        git push origin "HEAD:refs/heads/${BRANCH}"
      fi

      echo "Fixes pushed to ${BRANCH}."
      # verify the pushed state is clean; fails only if something is not auto-fixable
      pre-commit run --all-files --show-diff-on-failure
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never

.job-script: &job-script
  - pip install -e ".[docs]"
  - zensical build --clean

pages:
  stage: deploy_docs
  image: registry.cern.ch/docker.io/library/python:latest
  variables:
    GIT_DEPTH: "0"
  script: [*job-script, "if [[ -f _redirects ]]; then cp _redirects public; fi;"]
  artifacts:
    paths:
      - public
    expire_in: 1 hour
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never

api_report:
  stage: test
  trigger:
    project: anstein/hgtd-tools-internal
    branch: master
    strategy: mirror
  variables:
    TRIGGER_TARGET: "api_report_generate_files"
  rules:
    # schedules always run
    - if: $CI_PIPELINE_SOURCE == "schedule"
    # manual skip only for default-branch pushes containing the skip token
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_MESSAGE =~ /(?i)\[skip[ -]report\]/
      when: never
    # Run on pushes to the default branch (main or master)
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

api_test:
  stage: test
  trigger:
    project: anstein/hgtd-tools-internal
    branch: master
    strategy: depend
  variables:
    TRIGGER_TARGET: "api_test_generate_files"
    UPSTREAM_SOURCE_PROJECT_PATH: $CI_MERGE_REQUEST_SOURCE_PROJECT_PATH
    UPSTREAM_FALLBACK_PROJECT_PATH: $CI_PROJECT_PATH
    UPSTREAM_MR_BRANCH: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME
    UPSTREAM_COMMIT_BRANCH: $CI_COMMIT_BRANCH
  rules:
    # User can skip this expensive job (e.g. for building docs only)
    - if: '$CI_COMMIT_MESSAGE =~ /(?i)\[skip[ -]report\]/'
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

prepare_zenodo:
  stage: deploy_zenodo
  rules:
    # Never run on forks
    - if: '$CI_PROJECT_NAMESPACE != "anstein"'
      when: never
    - if: '$CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+\.[0-9]+/'
      when: on_success
    - when: never
  script:
    - git archive --format zip --output hgtd-tools_${CI_COMMIT_TAG}.zip ${CI_COMMIT_TAG}
    # Update publication settings
    - sed -i -e "s/<<DATE>>/$(date +%F)/g" .zenodo.json
    - sed -i -e "s/<<VERSION>>/${CI_COMMIT_TAG}/g" .zenodo.json
    - sed -i -e "s/<<VERSION_STRIPPED>>/${CI_COMMIT_TAG#v}/g" .zenodo.json
    - git diff .zenodo.json
  artifacts:
    paths:
      - "hgtd-tools_${CI_COMMIT_TAG}.zip"
      - .zenodo.json
    expire_in: 1 day

upload_zenodo:
  stage: deploy_zenodo
  needs:
    - job: prepare_zenodo
      artifacts: false
      optional: true
  variables:
    VERSION: latest
    HGTDTOOLS_PROJECT_PATH: '$CI_PROJECT_PATH'
    HGTDTOOLS_PROJECT_BRANCH: '$CI_COMMIT_REF_NAME'
    HGTDTOOLS_PROJECT_ISTAG: 'false'
  rules:
    # Never run on forks or merge requests
    - if: '$CI_PROJECT_NAMESPACE != "anstein"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    # Only run on tags with vX.Y.Z, not other ones
    - if: '$CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+\.[0-9]+/'
      variables:
        VERSION: $CI_COMMIT_TAG
        HGTDTOOLS_PROJECT_ISTAG: true
      when: on_success
    - when: never
  trigger:
    project: anstein/hgtd-tools-internal
    branch: master
    strategy: mirror
