[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hgtd-tools"
version = "2.0.0"
description = "Tools for the HGTD production database"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Annika Stein", email = "annika.stein@cern.ch" }]
license = "Apache-2.0"
keywords = ["atlas", "hgtd", "database", "cern", "physics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "matplotlib>=3.11",
    "mplhep>=1.3",
    "numpy>=2.3",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "jupyterlab>=4.4",
    "pandas>=2.3",
    "pre-commit>=4.3.0",
]
docs = ["zensical>=0.0.57"]
gui = ["customtkinter>=5.2.2", "Pillow>=10.0"]

[project.scripts]
hgtd-tools = "hgtd_tools.app.cli:main"
hgtd-tools-gui = "hgtd_tools.app.gui:main"

[project.urls]
Homepage = "https://gitlab.cern.ch/anstein/hgtd-tools"
Documentation = "https://hgtd-tools.docs.cern.ch/"
Reports = "https://hgtd-tools-internal.web.cern.ch/"

[tool.hatch.build.targets.wheel]
packages = ["src/hgtd_tools"]
artifacts = ["*.png", "src/hgtd_tools/assets/*.png"]
exclude = [
    "**/config_api",      # exact basename, no extension
    "**/config_api.*",    # any extension
    "notebooks/*.ipynb",
    ".github",
    "tests",
]
