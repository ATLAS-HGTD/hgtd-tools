[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "hgtd-tools"
version = "3.0.0-rc1"
description = "Tools for the HGTD production database"
readme = "README.md"
keywords = [ "atlas", "cern", "database", "hgtd", "physics" ]
license = "Apache-2.0"
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "matplotlib>=3.11",
  "mplhep>=1.3",
  "numpy>=2.3",
  "pandas>=2.3",
  "pyyaml>=6",
  "requests>=2.31",
]
[[project.authors]]
name = "Annika Stein"
email = "annika.stein@cern.ch"
[project.optional-dependencies]
dev = [ "pre-commit>=4.3" ]
dev-extra = [ "build", "jupyterlab>=4.4", "twine" ]
docs = [ "zensical>=0.0.57" ]
gui = [ "customtkinter>=5.2.2", "pillow>=10" ]
[project.urls]
Documentation = "https://hgtd-tools.docs.cern.ch/"
Homepage = "https://gitlab.cern.ch/anstein/hgtd-tools"
Reports = "https://hgtd-tools-internal.web.cern.ch/"
[project.scripts]
hgtd-tools = "hgtd_tools.app.cli:main"
hgtd-tools-gui = "hgtd_tools.app.gui:run_gui"
# scripts used primarily in GitLab CI with their own standalone entrypoints
order = "hgtd_tools.app.scripts.order:main"
report-stats = "hgtd_tools.app.scripts.report_stats:main"

[tool.hatch.build]
exclude = [
  "**/config_api",                  # exact basename, no extension
  "**/config_api.*",                # any extension
  "**/.*cache",
  "**/.cache",
  "**/.pytest_cache",
  "**/__pycache__",
  "**/assets/.ipynb_checkpoints/*",
  "**/.ipynb_checkpoints/",
  "**/.ipynb_checkpoints/**",
  # this defensive, should some of that ever move into the actual package dir
  "archived/",
  "archived/**",
  "dist/",
  "dist/**",
  "**/docs/**",
  "local/",
  "local/**",
  "local_info/",
  "local_info/**",
  "notebooks/",
  "notebooks/**",
  "public/",
  "public/**",
  "tests/",
  "tests/**",
  ".pre-commit-config.yaml",
  "env-312.yml",
  ".gitattributes",
  ".gitlab-ci.yml",
  "windowIcon.svg",
  "zensical.toml",
]
[tool.hatch.build.targets.sdist]
artifacts = [ "src/hgtd_tools/assets/*" ]
# exclude inherited from [tool.hatch.build]
[tool.hatch.build.targets.wheel]
packages = [ "src/hgtd_tools" ]
artifacts = [ "src/hgtd_tools/assets/*" ]
